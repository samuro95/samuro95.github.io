name: Sync Google Scholar

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import new publications and news
        run: python scripts/sync_scholar.py --profile-id f_rtYCAAAAAJ

      - name: Commit new entries
        run: |
          git add content/publication content/news data/scholar-sync.json
          if git diff --cached --quiet; then
            echo "No new publications"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: sync Google Scholar profile"
          git push
