<article class="news-item">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
  <div>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ else }}{{ with .Summary }}<p>{{ . }}</p>{{ end }}{{ end }}
    {{ with .Params.publication_url }}<a class="text-link" href="{{ . | relURL }}">View publication <span aria-hidden="true">→</span></a>{{ end }}
  </div>
</article>
